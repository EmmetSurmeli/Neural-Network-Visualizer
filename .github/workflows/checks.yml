name: Release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production backend
        run: docker build -t neuralscope-api .
      - name: Start production backend
        run: docker run -d --name neuralscope-api -p 8002:8000 -e ALLOWED_ORIGINS=https://example.com neuralscope-api
      - name: Verify readiness, import and prediction
        run: python3 scripts/smoke_deployment.py http://127.0.0.1:8002
      - name: Show server diagnostics
        if: failure()
        run: docker logs neuralscope-api
      - name: Stop production backend
        if: always()
        run: docker rm -f neuralscope-api || true
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -r backend/requirements.txt
      - name: Backend tests
        run: .venv/bin/python -m pytest backend/tests -q
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Frontend tests
        run: npm test --prefix frontend
      - name: TypeScript and production build
        run: npm run build --prefix frontend
      - name: Formatting and diff checks
        run: |
          git diff --check HEAD~1 HEAD
          python scripts/check_format.py
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:browser --prefix frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: frontend/test-results
